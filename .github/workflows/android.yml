name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build APK with EAS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build APK on Expo EAS
        run: |
          eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --wait

      - name: Get latest APK build
        id: get_build
        run: |
          eas build:list \
            --platform android \
            --profile preview \
            --status finished \
            --limit 1 \
            --json > build.json

          cat build.json

          node -e "
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('build.json', 'utf8'));
          const build = Array.isArray(data) ? data[0] : data.builds?.[0];

          if (!build) {
            console.error('No finished build found.');
            process.exit(1);
          }

          if (!build.artifacts || !build.artifacts.buildUrl) {
            console.error('APK download URL not found.');
            console.error(JSON.stringify(build, null, 2));
            process.exit(1);
          }

          fs.writeFileSync('build-url.txt', build.artifacts.buildUrl);
          console.log('APK URL: ' + build.artifacts.buildUrl);
          "

      - name: Download APK
        run: |
          mkdir -p artifacts

          APK_URL=$(cat build-url.txt)

          echo "Downloading APK..."
          curl -L "$APK_URL" -o artifacts/app.apk

          echo "APK downloaded:"
          ls -lh artifacts/app.apk

      - name: Upload APK to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: artifacts/app.apk
          if-no-files-found: error
          retention-days: 3
